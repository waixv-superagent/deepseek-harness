name: Desktop Mac Unsigned

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-mac-unsigned
  cancel-in-progress: false

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: x64
            runner: macos-13
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      DSH_DESKTOP_TARGET_PLATFORM: darwin
      DSH_DESKTOP_TARGET_ARCH: ${{ matrix.arch }}
      DSH_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build workspace libraries
        run: pnpm run build:lib
      - name: Build the unsigned installer
        run: pnpm run package:desktop:mac:${{ matrix.arch }}:unsigned
      - name: Retain the unsigned app
        uses: actions/upload-artifact@v4
        with:
          name: desktop-mac-${{ matrix.arch }}-unsigned
          include-hidden-files: true
          path: |
            apps/desktop/.desktop-build/targets/mac-${{ matrix.arch }}/unsigned-artifacts/**
            apps/desktop/.desktop-build/packaging-runs/**
          if-no-files-found: error
          retention-days: 7
