name: Desktop Mac Unsigned

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Source commit SHA (defaults to the dispatch commit)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-mac-unsigned
  cancel-in-progress: false

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      DSH_DESKTOP_TARGET_PLATFORM: darwin
      DSH_DESKTOP_TARGET_ARCH: arm64
      DSH_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the unsigned installer
        run: pnpm run package:desktop:mac:arm64:unsigned
      - name: Retain the unsigned app
        uses: actions/upload-artifact@v4
        with:
          name: desktop-mac-arm64-unsigned
          include-hidden-files: true
          path: |
            apps/desktop/.desktop-build/targets/mac-arm64/unsigned-artifacts/**
            apps/desktop/.desktop-build/packaging-runs/**
          if-no-files-found: error
          retention-days: 7
